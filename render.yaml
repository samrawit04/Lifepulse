services:
  - type: web
    name: lifeos-api
    env: docker
    dockerfilePath: backend/LifeOS.Api/Dockerfile
    dockerContext: backend/LifeOS.Api
    plan: free
    envVars:
      # Secrets are NOT stored in this file. Set their values in the Render
      # dashboard (Environment tab); "sync: false" tells Render not to overwrite them.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: "LifeOS"
      - key: Jwt__Audience
        value: "LifeOS"
      - key: Jwt__ExpiryDays
        value: "7"
      # Protects /api/admin/backup/*. Render generates a random value; copy it
      # from the dashboard if you want to run backups against production.
      - key: Admin__ApiKey
        generateValue: true
